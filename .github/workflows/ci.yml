name: dsh-handheld CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Mobile adaptation contract gate. The app's whole value is "dsh's web UI on a
  # phone", and that adaptation rests entirely on dsh's DOM hooks (data-phase,
  # data-composer-input, …) which have NO version contract: dsh evolves on its
  # own, the plugin is vendored and pinned. If dsh renames one, the adaptation
  # silently breaks and you only find out on the phone.
  #
  # This job asserts the vendored plugin still reads exactly the hooks declared
  # in the committed contract, so re-vendoring cannot quietly widen our
  # dependency on unverified hooks. It is static (Node only, no browser, no
  # dsh install) and runs in seconds.
  #
  # The FULL check — proving each declared hook actually exists in the installed
  # dsh frontend — needs dsh present, so it runs on the machine that has dsh:
  #   node scripts/check-mobile-hooks.mjs
  # Run it after every dsh upgrade. See docs/mobile-ui-verification.md.
  mobile-contract:
    name: Mobile adaptation contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 先做一次语法检查：注入的 bundle 是**模板字面量**拼出来的（CSS 那段在 `` ` `` 里），
      # 注释里混进一个反引号就会把模板提前结束、语法直接坏 —— 而这个错在「读文本」的
      # 契约检查里看不出来（2026-09-18 本人踩过三次）。node --check 一秒就能拦住。
      - name: Syntax-check the injected bundles
        run: |
          node --check android/app/src/main/assets/plugins/dsh-handheld-mobile.js
          node --check android/app/src/main/assets/plugins/mobile-bootstrap.js
          echo "✓ 两个注入 bundle 语法通过"

      - name: Verify plugin ⇄ contract agreement
        run: node scripts/check-mobile-hooks.mjs --contract

      - name: Verify the bootstrap template is the single source
        run: |
          # The injection bootstrap lives in assets and is read by BOTH the app
          # (MainActivity.mobileBootstrapJs) and the verification harness. If it
          # drifted back into a Kotlin raw string the harness would test
          # something the app does not run.
          test -f android/app/src/main/assets/plugins/mobile-bootstrap.js \
            || { echo "::error::mobile-bootstrap.js 缺失"; exit 1; }
          if grep -q 'Object.defineProperty(window, "__DSH_BOOT__"' \
               android/app/src/main/java/com/dshhandheld/app/MainActivity.kt; then
            echo "::error::MainActivity 里又出现了内联的注入脚本 —— 必须只从 assets 读取"
            exit 1
          fi
          # 光有否定断言不够（审计 M13）：把「读资产 / 注入脚本」那两行删掉，上面两条都不会红，
          # 而适配注入就静默消失了。补正向断言。
          grep -q 'assets.open("plugins/mobile-bootstrap.js")' \
            android/app/src/main/java/com/dshhandheld/app/MainActivity.kt \
            || { echo "::error::MainActivity 不再从 assets 读 mobile-bootstrap.js"; exit 1; }
          grep -q 'addDocumentStartJavaScript' \
            android/app/src/main/java/com/dshhandheld/app/MainActivity.kt \
            || { echo "::error::MainActivity 不再注入引导脚本（addDocumentStartJavaScript 消失）"; exit 1; }
          echo "✓ 注入脚本只有 assets 一份，且 App 确实在读它、注入它"

      - name: Verify nothing CI-only ships inside the APK
        run: |
          # assets/ 会被**整个**打进 APK。这里放的东西必须是运行时真正需要的，
          # 否则每个用户都会下载到一份只对 CI 有意义的文件。
          # 真实教训：契约文件曾被放在 assets/plugins/ 下，随 0.1.4 发布包一起发了出去。
          #
          # 审计 M13：原先只枚举 assets/plugins/ 一个子目录（注释说的却是整个 assets/），
          # 且 `|| true` 会把 ls 失败一起吞掉 —— 现在对整棵 assets/ 做白名单，并断言文件数非零。
          allowed='plugins/dsh-handheld-mobile\.js|plugins/mobile-bootstrap\.js'
          found=$(cd android/app/src/main/assets && find . -type f | sed 's|^\./||' | sort)
          total=$(printf '%s\n' "$found" | grep -c . || true)
          if [ "$total" -eq 0 ]; then
            echo "::error::assets/ 里一个文件都没有 —— 这条检查空转了"
            exit 1
          fi
          unexpected=$(printf '%s\n' "$found" | grep -vEx "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::assets/ 里有非运行时文件（会被打进 APK）：$unexpected"
            exit 1
          fi
          echo "✓ assets/ 只含运行时文件（$total 个）"

  # Terminal conformance gate: proves the differential test bed still works.
  # Runs first and needs no Android SDK — it is pure JVM, so it finishes in seconds
  # and a failure here means the corpus or the harness rotted, not the app.
  conformance:
    name: Terminal conformance harness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 把缓存实现拆成了独立组件：默认的 'enhanced' 是**商业**的
          # gradle-actions-caching，升级到 v6 即视为接受其 Terms of Use。
          # 本项目是 GPL-3.0，不想顺手接受一份专有条款，所以显式选开源的 basic
          # （基于 @actions/cache，MIT）。功能上对本项目够用：缓存 ~/.gradle/caches
          # 与 ~/.gradle/wrapper，键由构建文件派生。
          # 若哪天想换回 enhanced，删掉这两行即可 —— 但那是知情选择。
          cache-provider: basic
        # 刻意不写 gradle-version：版本由 android/gradle/wrapper/gradle-wrapper.properties
        # 决定，`./gradlew` 自行下载。此前 CI 写死 8.5、wrapper 也写 8.5、本地脚本还调
        # 裸 `gradle` —— 三个出处，改一处就会静默漂移。

      - name: Run conformance gate (coverage + selftest + check)
        run: |
          cd android
          ./gradlew :terminal-conformance:conformance --no-daemon

      # Invariant, not a nicety: terminal-conformance contains android.util /
      # android.graphics stand-ins so the reference emulator links on a plain JVM.
      # If it ever became an app dependency those stubs would collide with the real
      # framework classes, so the module must stay out of the APK's graph.
      - name: Verify the harness stays out of the app's dependency graph
        run: |
          cd android
          # 必须开 pipefail（审计 M12）：默认 shell 只看管道最后一个命令的退出码，
          # gradle 失败/配置改名时 stdout 为空 → grep 退 1 → 这步会打印 ✓ —— 不变量永久空转。
          set -o pipefail
          if ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
               | grep -q "terminal-conformance"; then
            echo "::error:::app must never depend on :terminal-conformance (android.* stubs would enter the APK)"
            exit 1
          fi
          echo "✓ :app does not depend on :terminal-conformance（且这次查询确实跑完了）"

  build-dropbear:
    name: Build dropbear dbclient (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Android SDK (NDK)
        uses: android-actions/setup-android@v4
        with:
          # 默认 packages 是 "tools platform-tools"，而 SDK 仓库**已经不再提供 `tools`
          # 这个包**：sdkmanager 报 `Warning: Failed to find package 'tools'` 并以 1 退出，
          # 于是 setup-android 这一步必失败。2026-09-15 复现；main 上（无任何代码改动）
          # 同样失败，而同一份 action SHA 与同一版镜像在 09-14 还是成功的 ——
          # 变的是 SDK 仓库，不是代码。
          # 本项目不需要 `tools`：NDK 由镜像预装，platform / build-tools 在下面自己装。
          packages: platform-tools

      # NDK 必须先定位（审计 M14）：它是构建的**真实输入之一**（脚本里的 CC/AR/RANLIB/STRIP
      # 全部来自 $ANDROID_NDK_HOME，而 NDK 来自 runner 镜像、会随镜像滚动），
      # 所以它的版本要进缓存键 —— 原先不含它，命中缓存时整步跳过，产物与「当前工具链」脱钩，
      # 日志里连「这版二进制由哪个 NDK 编出来」都看不到。
      - name: Locate NDK
        id: ndk
        run: |
          ndk="$($ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                 --list_installed | sed -E 's/( +[|] +)/|/g;s/ +$//' | \
                 grep '^  ndk' | cut -d '|' -f 4 | sort | head -n1)"
          if [ -z "$ndk" ]; then
            echo "::error::镜像里没有 NDK —— 这一步是构建的前提，不能静默继续"
            exit 1
          fi
          echo "NDK: $ndk"
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"

      # 缓存键 = 脚本 + localoptions.h + **NDK 版本** + runner OS。dropbear 版本号写在脚本里，
      # 脚本一改键就变，所以不会用旧产物冒充新版本。命中时省掉 clone + 交叉编译。
      - name: Cache dropbear build
        id: dropbear-cache
        uses: actions/cache@v6
        with:
          path: build-dropbear-output
          key: dropbear-${{ runner.os }}-ndk${{ steps.ndk.outputs.ndk }}-${{ hashFiles('scripts/build-dropbear.sh', 'scripts/localoptions.h') }}

      - name: Build dbclient
        if: steps.dropbear-cache.outputs.cache-hit != 'true'
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/${{ steps.ndk.outputs.ndk }}" ./scripts/build-dropbear.sh

      - name: Report cache status
        run: |
          ls -la build-dropbear-output/
          # 缓存命中时**也**要检查内容（审计 M14）：空目录 / 截断的缓存原先会被当成可用产物，
          # 一路传到 build job 才以别的方式炸掉。
          for f in dbclient dropbearkey; do
            test -s "build-dropbear-output/$f" \
              || { echo "::error::build-dropbear-output/$f 缺失或为空（缓存不可用）"; exit 1; }
          done
          if [ "${{ steps.dropbear-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✓ 复用缓存的 dbclient（脚本与 NDK 版本都未变：${{ steps.ndk.outputs.ndk }}）"
          else
            echo "✓ 重新编译 dbclient（NDK ${{ steps.ndk.outputs.ndk }}）"
          fi

      - name: Upload dbclient
        uses: actions/upload-artifact@v7
        with:
          name: dropbear-arm64
          path: build-dropbear-output
          # 缓存/构建写空目录时默认只 warning（审计 L10）——下游 build job 会因此拿到空 artifact。
          if-no-files-found: error

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Gate the artifact on the terminal harness: when it fails, terminal behaviour in
    # this tree is unverified, so there is no point producing an APK from it.
    needs: [build-dropbear, conformance, mobile-contract]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 理由同 build-dropbear job：默认要装的 `tools` 包在 SDK 仓库里已经不存在，
          # 让它去装只会得到 Failed to find package 'tools' 然后失败。
          packages: platform-tools

      # AGP 9.4 要求 SDK Build Tools ≥ 36.0.0（36.0.0 也是它的默认值），compileSdk 36
      # 需要 `platforms;android-36`。两者都不保证已预装在 runner 镜像里。AGP 虽能按需
      # 自动下载，但显式装上能让「缺组件」这类失败在一步之内看清，而不是混在 Gradle 日志中。
      - name: Install SDK platform + build-tools required by AGP 9
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic   # 理由同 conformance job：避开 v6 的商业缓存组件
        # 版本来源同 conformance job：wrapper 是唯一出处。

      - name: Fetch dropbear dbclient
        uses: actions/download-artifact@v8
        with:
          name: dropbear-arm64
          path: dbclient

      - name: Stage dbclient into app jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          install -m 0755 dbclient/dbclient android/app/src/main/jniLibs/arm64-v8a/libdbclient.so
          install -m 0755 dbclient/dropbearkey android/app/src/main/jniLibs/arm64-v8a/libdropbearkey.so
          cp dbclient/LICENSE.txt android/app/src/main/jniLibs/arm64-v8a/LICENSE-dropbear.txt 2>/dev/null || true
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      # 签名材料只在此步落地，构建后立即删除；绝不写入仓库。
      #
      # ⚠️ 判据必须与 Gradle 的 `hasReleaseSigning` **逐项一致**（审计 H3）：那边要求四个
      # 变量全部非空，这边原先只看 keystore 一个 —— 于是「keystore 有、密码类 secret 缺一个」
      # 时这里不告警、还报 available=true，而 Gradle 用公开的 debug.keystore 签，
      # 产物名却与正式包一模一样。现在四缺一就明确标记 + 告警。
      - name: Materialize release signing material
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing SIGNING_STORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing SIGNING_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::签名 secrets 缺项：$missing —— release 将回退 debug 签名，该产物不可对外分发（artifact 会带 -debugsigned 后缀）。"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # 硬校验：发布产物必须「不可调试」。debuggable=true 会让 `run-as` 无需 root
      # 即可读取应用私有目录（含经 Keystore 加密前的明文回退路径），并使 WebView
      # 远程调试对整个局域网开放。此步失败即构建失败，避免误发布。
      #
      # 2026-09-17 审计 M11/H3 追加三条：native 库真的进了包、versionCode 与源码一致、
      # 签名者身份与本次 secrets 状态相符 —— 原先只查了「不可调试」这一条，
      # 而它和「这个包能不能用」几乎正交。
      - name: Verify release APK identity
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::未找到 release APK"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -n1)
          BADGE=$("$AAPT" dump badging "$APK" | grep -c "application-debuggable" || true)
          if [ "$BADGE" != "0" ]; then
            echo "::error::APK 是 debuggable 的，拒绝发布"
            "$AAPT" dump badging "$APK" | grep "application-debuggable"
            exit 1
          fi
          echo "✓ application-debuggable 不存在（不可调试）"
          "$AAPT" dump badging "$APK" | grep -E "^package|^application-label|sdkVersion|targetSdkVersion"

          # 1) native 库必须在包里：dbclient/dropbearkey 是**子进程 exec** 的，缺 .so 不是崩溃，
          #    而是「隧道永远起不来」（binPath=null）。useLegacyPackaging=true 才会解包出真实路径。
          #    （dropbearconvert 要等私钥导入那支合进来才进包，那时把 libdropbearconvert.so 加进这个列表。）
          for lib in libdbclient.so libdropbearkey.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib" \
              || { echo "::error::APK 里没有 lib/arm64-v8a/$lib"; exit 1; }
          done
          echo "✓ native 库都进包了"

          # 2) versionCode 必须与源码一致：发版忘了提版本号时，两个包无法互相覆盖升级。
          SRC_CODE=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts | head -n1)
          APK_CODE=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
          if [ -z "$SRC_CODE" ] || [ "$SRC_CODE" != "$APK_CODE" ]; then
            echo "::error::versionCode 不一致：源码=$SRC_CODE APK=$APK_CODE"
            exit 1
          fi
          echo "✓ versionCode 一致（$APK_CODE）"

          # 3) 签名者身份与本次 secrets 状态相符（审计 H3）：正式签名时**不得**是仓库里那把
          #    公开的调试证书；回退时必须是它（上面已告警，产物名也带 -debugsigned）。
          #
          #    判据用**证书指纹**而不是 DN 字符串：本仓库的 debug.keystore 不是 AOSP 默认那把
          #    （subject 是 C=NA, ST=NA, L=NA, O=pawpaw-agent, OU=Dev, CN=PiMobile Debug），
          #    按 "Android Debug" 判永远匹配不上 —— 第一版就是这么写成「空 DN 也照样打勾」的。
          #    指纹从仓库里那把 debug.keystore 现取，不需要任何 secret；任何一步取不到指纹
          #    就**直接失败**（拒绝用「没检查」换「绿」）。
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort | tail -n1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，签名校验做不了"
            exit 1
          fi
          DBG_PRINT=$(keytool -exportcert -keystore android/app/debug.keystore \
                        -storepass android -alias androiddebugkey 2>/dev/null \
                      | openssl x509 -inform DER -noout -fingerprint -sha256 \
                      | sed 's/.*=//' | tr -d ':' | tr 'A-Z' 'a-z')
          CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          # 不锚定前缀：apksigner 各版本的措辞变过（本仓库踩过一次），只认「SHA-256 digest」这一行。
          APK_PRINT=$(printf '%s\n' "$CERTS" | grep -m1 -i "sha-256 digest" \
                      | sed 's/.*: *//' | tr -d ' :' | tr 'A-Z' 'a-z')
          echo "调试证书指纹: $DBG_PRINT"
          echo "APK 证书指纹: $APK_PRINT"
          if [ -z "$DBG_PRINT" ] || [ -z "$APK_PRINT" ]; then
            echo "::error::指纹取不到（keytool / openssl / apksigner 有一处没成）—— 拒绝把「没检查」当通过"
            echo "--- apksigner 原始输出（前 12 行）---"
            printf '%s\n' "$CERTS" | head -n12
            rm -f "$RUNNER_TEMP/release.keystore" 2>/dev/null || true
            exit 1
          fi
          if [ "$APK_PRINT" = "$DBG_PRINT" ]; then
            if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
              echo "::error::secrets 齐全，却签成了仓库里的调试证书 —— 拒绝把这份产物当正式包"
              exit 1
            fi
            echo "::warning::回退调试签名（secrets 缺项），该产物不可对外分发"
          else
            echo "✓ 使用发布签名（不是仓库里的调试证书）"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # 回退签名的产物换名字：免得「同名 artifact」被当成正式包拿走（审计 H3）。
          name: ${{ steps.signing.outputs.available == 'true' && 'dsh-handheld-release' || 'dsh-handheld-release-debugsigned' }}
          path: android/app/build/outputs/apk/release/app-release.apk
          # artifact 路径写错时默认只 warning（审计 L10）——这里要它直接失败。
          if-no-files-found: error

      # 另出一份 **debug** 包，专供真机验证移动端适配。
      #
      # 为什么需要它：MainActivity 只在 debuggable 时开 `setWebContentsDebuggingEnabled`，
      # 而 release 包必须保持不可调试（上面那步硬校验）。于是「真机上页面到底被适配成什么样」
      # 这一层，用 release 包**无法取证** —— 拿不到 WebView 的 DOM。
      #
      # 有了 debug 包的 WebView devtools socket，就能 adb forward 后直接查真实渲染结果
      # （[data-handheld] 在不在、有没有横向溢出），也就是把 scripts/ui-verify.mjs
      # 对真实页面做的那套断言搬到真机上。见 docs/mobile-ui-verification.md。
      #
      # ⚠️ 该产物是 debuggable + debug 签名，**绝不可对外分发**，只是 CI artifact。
      - name: Build debug APK (for on-device UI verification)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: dsh-handheld-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          # 这份是文档里真机取证的**唯一来源**（docs/mobile-ui-verification.md），
          # 缺了必须红，不能只 warning（审计 L10）。
          if-no-files-found: error
